name: Restaurar Backup Supabase

on:
  push:
    branches: [claude/setup-rls-tables-QA4Za]
    paths:
      - '.github/workflows/restore-backup.yml'
      - 'sql/post-restore.sql'

env:
  SUPABASE_REF: eaovtnotwfzuxgtqpkay

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verificar dados atuais e listar backups
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 1. Verificando dados atuais ==="
          DADOS=$(curl -s -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT (SELECT COUNT(*) FROM public.vendas) AS vendas, (SELECT COUNT(*) FROM public.clientes) AS clientes, (SELECT COUNT(*) FROM public.movimentacao_caixa) AS movimentacoes"}')
          echo "Dados atuais: $DADOS"

          echo "=== 2. Listando backups disponíveis ==="
          BACKUPS=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/backups" \
            -H "Authorization: Bearer ${SUPABASE_PAT}")
          HTTP_CODE=$(echo "$BACKUPS" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$BACKUPS" | grep -v "HTTP_STATUS:")
          echo "HTTP: $HTTP_CODE"
          echo "Backups: $BODY"

          echo "=== 3. Verificando endpoint alternativo ==="
          BACKUPS2=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/backups" \
            -H "Authorization: Bearer ${SUPABASE_PAT}")
          HTTP2=$(echo "$BACKUPS2" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY2=$(echo "$BACKUPS2" | grep -v "HTTP_STATUS:")
          echo "HTTP alt: $HTTP2 | $BODY2"

          # Montar resultado
          RESULT="=== DADOS ATUAIS ===
$DADOS

=== BACKUPS (database/backups) HTTP $HTTP_CODE ===
$BODY

=== BACKUPS (alt /backups) HTTP $HTTP2 ===
$BODY2"

          # Gravar debug-restore.txt via GitHub API
          DEBUG_CONTENT=$(printf '%s' "$RESULT" | base64 -w0)
          FILE_SHA=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-restore.txt?ref=${GITHUB_REF_NAME}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          SHA_PARAM=""
          [ -n "$FILE_SHA" ] && SHA_PARAM=",\"sha\":\"${FILE_SHA}\""
          curl -s -X PUT \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-restore.txt" \
            -d "{\"message\":\"debug: restore result [skip ci]\",\"content\":\"${DEBUG_CONTENT}\",\"branch\":\"${GITHUB_REF_NAME}\"${SHA_PARAM}}"
          echo "Arquivo debug-restore.txt gravado."

      - name: Restaurar backup mais recente (antes de 06/05/2026 00:32 UTC)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BACKUPS=$(curl -s \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/backups" \
            -H "Authorization: Bearer ${SUPABASE_PAT}")

          BACKUP_ID=$(echo "$BACKUPS" | python3 - <<'PYEOF'
import json, sys
from datetime import datetime, timezone

raw = """$BACKUPS"""

# Tentar parsear o JSON dos backups
try:
    data = json.loads(raw)
except:
    sys.exit(0)

backups = data if isinstance(data, list) else data.get('backups', data.get('data', []))

cutoff = datetime(2026, 5, 6, 0, 32, 0, tzinfo=timezone.utc)
valid = []

for b in backups:
    for key in ('inserted_at', 'created_at', 'snapshot_at', 'started_at'):
        ts_str = b.get(key, '')
        if ts_str:
            try:
                ts = datetime.fromisoformat(ts_str.replace('Z', '+00:00'))
                if ts < cutoff:
                    bid = b.get('id') or b.get('backup_id') or b.get('name', '')
                    valid.append((ts, str(bid)))
            except:
                pass
            break

if valid:
    valid.sort(reverse=True)
    print(valid[0][1])
PYEOF
          )

          echo "Backup ID selecionado: '$BACKUP_ID'"

          if [ -z "$BACKUP_ID" ] || [ "$BACKUP_ID" = "None" ]; then
            echo "Nenhum backup adequado encontrado. Abortando restore."
            exit 0
          fi

          echo "Iniciando restore do backup $BACKUP_ID..."
          RESTORE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/backups/${BACKUP_ID}/restore" \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            -H "Content-Type: application/json" \
            -d '{}')
          HTTP=$(echo "$RESTORE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESTORE" | grep -v "HTTP_STATUS:")
          echo "Restore HTTP: $HTTP | $BODY"

          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] 2>/dev/null; then
            echo "Restore aceito! Aguardando 3 min..."
            sleep 180
          else
            echo "Restore falhou: HTTP $HTTP"
            exit 1
          fi

      - name: Re-aplicar migrações pós-restore
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Re-aplicando STEP 24 e 25..."
          PAYLOAD=$(python3 -c "
import json, sys
sql = open('sql/post-restore.sql').read()
print(json.dumps({'query': sql}))
")
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --max-time 60)
          HTTP=$(echo "$RESP" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESP" | grep -v "HTTP_STATUS:")
          echo "Post-restore HTTP: $HTTP | $BODY"

          # Atualizar debug com resultado final
          RESULT="POST-RESTORE HTTP: $HTTP
$BODY"
          DEBUG_CONTENT=$(printf '%s' "$RESULT" | base64 -w0)
          FILE_SHA=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-restore.txt?ref=${GITHUB_REF_NAME}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          SHA_PARAM=""
          [ -n "$FILE_SHA" ] && SHA_PARAM=",\"sha\":\"${FILE_SHA}\""
          curl -s -X PUT \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-restore.txt" \
            -d "{\"message\":\"debug: post-restore result [skip ci]\",\"content\":\"${DEBUG_CONTENT}\",\"branch\":\"${GITHUB_REF_NAME}\"${SHA_PARAM}}" || true
