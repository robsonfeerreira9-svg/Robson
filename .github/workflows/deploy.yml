name: Deploy HG Grifes ERP

on:
  push:
    branches: [claude/setup-rls-tables-QA4Za]
  workflow_dispatch:

env:
  SUPABASE_URL: https://eaovtnotwfzuxgtqpkay.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_MhNCcezzMUbC7eEXfKByEA_xrFfZnl_
  SUPABASE_REF: eaovtnotwfzuxgtqpkay

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ── 1. Migration via Supabase Management API ──────────
      - name: Migration SQL no Supabase
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: |
          mkdir -p /tmp/debug
          echo "Token length: ${#SUPABASE_PAT}" > /tmp/debug/result.txt

          if [ -z "$SUPABASE_PAT" ]; then
            echo "ERRO: secret SUPABASE_PAT nao configurado!" >> /tmp/debug/result.txt
            cat /tmp/debug/result.txt
            exit 1
          fi

          python3 -c "import json; sql=open('sql/schema.sql').read(); print(json.dumps({'query':sql}))" > /tmp/query.json
          echo "JSON size: $(wc -c < /tmp/query.json) bytes" >> /tmp/debug/result.txt

          RESPONSE=$(curl -sv -w "\nHTTP_CODE:%{http_code}" \
            -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            -H "Content-Type: application/json" \
            --data @/tmp/query.json \
            --max-time 60 2>&1)

          echo "$RESPONSE" >> /tmp/debug/result.txt
          cat /tmp/debug/result.txt

          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | tail -1 | cut -d: -f2)
          echo "Extracted HTTP: $HTTP_CODE" >> /tmp/debug/result.txt

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Migration concluida!"
          else
            echo "Erro na migration! HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-debug
          path: /tmp/debug/result.txt

      # ── 2. Bucket de Storage ─────────────────────────────
      - name: Criar bucket 'produtos'
        run: |
          curl -sf -X POST \
            "${SUPABASE_URL}/storage/v1/bucket" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"id":"produtos","name":"produtos","public":true}' \
          && echo "Bucket criado" \
          || echo "Bucket ja existe (ok)"

      # ── 3. Deps do projeto ───────────────────────────────
      - name: npm ci
        run: npm ci

      # ── 4. Deploy Vercel ─────────────────────────────────
      - name: Deploy para Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NRmTqJ7tXyq4AOLENBGyFHsa
        run: |
          npx vercel@latest link \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --yes

          echo "${SUPABASE_URL}" | npx vercel@latest env add \
            NEXT_PUBLIC_SUPABASE_URL production \
            --token "$VERCEL_TOKEN" --force 2>/dev/null || true

          echo "${SUPABASE_ANON_KEY}" | npx vercel@latest env add \
            NEXT_PUBLIC_SUPABASE_ANON_KEY production \
            --token "$VERCEL_TOKEN" --force 2>/dev/null || true

          DEPLOY_URL=$(npx vercel@latest deploy --prod \
            --token "$VERCEL_TOKEN" --yes 2>&1 | grep "^https://" | tail -1)

          echo ""
          echo "======================================="
          echo "  DEPLOY CONCLUIDO!"
          echo "  URL: $DEPLOY_URL"
          echo "======================================="
