name: Deploy HG Grifes ERP

on:
  push:
    branches: [claude/setup-rls-tables-QA4Za]
  workflow_dispatch:

env:
  SUPABASE_URL: https://eaovtnotwfzuxgtqpkay.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_MhNCcezzMUbC7eEXfKByEA_xrFfZnl_
  SUPABASE_REF: eaovtnotwfzuxgtqpkay

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ── 0. Restaurar backup se banco estiver vazio ────────
      - name: Restaurar backup Supabase (se dados perdidos)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/restore-check.py

      # ── 1a. Segurança: bloquear deploy se schema.sql tem DELETE perigoso ────
      - name: Verificar segurança do schema.sql
        run: python3 scripts/check-schema-safety.py

      # ── 1b. Migration via Supabase Management API ──────────
      - name: Migration SQL no Supabase
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "import json; sql=open('sql/schema.sql').read(); print(json.dumps({'query':sql}))" > /tmp/query.json

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            -H "Content-Type: application/json" \
            --data @/tmp/query.json \
            --max-time 60)

          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "HTTP: $HTTP_CODE"
          echo "Response: $BODY"

          # Escrever debug diretamente via GitHub API (não precisa de git push)
          DEBUG_CONTENT=$(printf "HTTP: %s\n%s" "$HTTP_CODE" "$BODY" | base64 -w0)
          FILE_SHA=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt?ref=${GITHUB_REF_NAME}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$FILE_SHA" ]; then
            SHA_PARAM=",\"sha\":\"${FILE_SHA}\""
          else
            SHA_PARAM=""
          fi
          curl -s -X PUT \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt" \
            -d "{\"message\":\"debug: migration result [skip ci]\",\"content\":\"${DEBUG_CONTENT}\",\"branch\":\"${GITHUB_REF_NAME}\"${SHA_PARAM}}"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            echo "Migration concluida!"
          else
            echo "Erro na migration! HTTP $HTTP_CODE"
            exit 1
          fi

      # ── 2. Bucket de Storage ─────────────────────────────
      - name: Criar bucket 'produtos'
        run: |
          curl -sf -X POST \
            "${SUPABASE_URL}/storage/v1/bucket" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"id":"produtos","name":"produtos","public":true}' \
          && echo "Bucket criado" \
          || echo "Bucket ja existe (ok)"

      # ── 3. Deps do projeto ───────────────────────────────
      - name: npm install
        run: npm install

      # ── 4. Deploy Vercel ─────────────────────────────────
      - name: Deploy para Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NRmTqJ7tXyq4AOLENBGyFHsa
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REMOVE_BG_API_KEY: ${{ secrets.REMOVE_BG_API_KEY }}
        run: |
          set +e  # Capturar erros manualmente

          # Obter ou criar projeto via Vercel API
          echo "=== Verificando projeto na Vercel API ==="
          API_RESP=$(curl -s \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/hg-grifes-erp?teamId=${VERCEL_ORG_ID}")
          echo "API resp: ${API_RESP:0:200}"
          PROJECT_ID=$(echo "$API_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)

          if [ -z "$PROJECT_ID" ]; then
            echo "Criando projeto..."
            CREATE_RESP=$(curl -s -X POST \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects?teamId=${VERCEL_ORG_ID}" \
              -d '{"name":"hg-grifes-erp","framework":"nextjs"}')
            echo "Create resp: ${CREATE_RESP:0:200}"
            PROJECT_ID=$(echo "$CREATE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
          fi

          echo "PROJECT_ID: $PROJECT_ID"

          # Criar .vercel/project.json
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          cat .vercel/project.json

          # Adicionar env vars
          echo "=== Vercel Env ==="
          echo "${SUPABASE_URL}" | npx vercel@latest env add \
            NEXT_PUBLIC_SUPABASE_URL production \
            --token "$VERCEL_TOKEN" --force 2>/dev/null || true
          echo "${SUPABASE_ANON_KEY}" | npx vercel@latest env add \
            NEXT_PUBLIC_SUPABASE_ANON_KEY production \
            --token "$VERCEL_TOKEN" --force 2>/dev/null || true
          echo "${RESEND_API_KEY}" | npx vercel@latest env add \
            RESEND_API_KEY production \
            --token "$VERCEL_TOKEN" --force 2>/dev/null || true
          echo "${SUPABASE_SERVICE_ROLE_KEY}" | npx vercel@latest env add \
            SUPABASE_SERVICE_ROLE_KEY production \
            --token "$VERCEL_TOKEN" --force 2>/dev/null || true
          if [ -n "${REMOVE_BG_API_KEY}" ]; then
            echo "=== Configurando REMOVE_BG_API_KEY via Vercel API ==="
            # Verificar se já existe
            EXISTING=$(curl -s \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
              | python3 -c "import sys,json; envs=json.load(sys.stdin).get('envs',[]); match=[e for e in envs if e.get('key')=='REMOVE_BG_API_KEY']; print(match[0]['id'] if match else '')" 2>/dev/null || echo "")
            if [ -n "$EXISTING" ]; then
              # Atualizar existente
              PATCH_RESP=$(curl -s -X PATCH \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.vercel.com/v10/projects/${PROJECT_ID}/env/${EXISTING}?teamId=${VERCEL_ORG_ID}" \
                -d "{\"value\":\"${REMOVE_BG_API_KEY}\",\"target\":[\"production\"],\"type\":\"encrypted\"}")
              echo "REMOVE_BG_API_KEY atualizado: $(echo $PATCH_RESP | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('key','erro'))" 2>/dev/null)"
            else
              # Criar novo
              POST_RESP=$(curl -s -X POST \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
                -d "{\"key\":\"REMOVE_BG_API_KEY\",\"value\":\"${REMOVE_BG_API_KEY}\",\"target\":[\"production\"],\"type\":\"encrypted\"}")
              echo "REMOVE_BG_API_KEY criado: $(echo $POST_RESP | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('key','erro'))" 2>/dev/null)"
            fi
          fi

          # Deploy
          echo "=== Vercel Deploy ==="
          export VERCEL_PROJECT_ID="$PROJECT_ID"
          DEPLOY_OUT=$(npx vercel@latest deploy --prod --token "$VERCEL_TOKEN" --yes \
            --build-env NEXT_PUBLIC_SUPABASE_URL="${SUPABASE_URL}" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" 2>&1)
          DEPLOY_EXIT=$?
          echo "$DEPLOY_OUT"

          # Salvar resultado no debug file
          RESULT_TEXT=$(printf "PROJECT_ID=%s\nDEPLOY_EXIT=%s\n%s" "$PROJECT_ID" "$DEPLOY_EXIT" "$DEPLOY_OUT")
          DEBUG_CONTENT=$(echo "$RESULT_TEXT" | base64 -w0)
          FILE_SHA=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt?ref=${GITHUB_REF_NAME}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$FILE_SHA" ]; then SHA_P=",\"sha\":\"${FILE_SHA}\""; else SHA_P=""; fi
          curl -s -X PUT -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt" \
            -d "{\"message\":\"debug: vercel result [skip ci]\",\"content\":\"${DEBUG_CONTENT}\",\"branch\":\"${GITHUB_REF_NAME}\"${SHA_P}}" || true

          DEPLOY_URL=$(echo "$DEPLOY_OUT" | grep "^https://" | tail -1)
          echo ""
          echo "======================================="
          echo "  PROJECT_ID: $PROJECT_ID"
          echo "  DEPLOY_URL: $DEPLOY_URL"
          echo "  EXIT: $DEPLOY_EXIT"
          echo "======================================="

          exit $DEPLOY_EXIT
