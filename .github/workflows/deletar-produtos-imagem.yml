name: Deletar Produtos da Imagem (12/05)

on:
  push:
    branches: [claude/setup-rls-tables-QA4Za]
    paths: ['.github/workflows/deletar-produtos-imagem.yml']

jobs:
  deletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deletar produtos zerados da imagem
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/deletar-produtos-imagem.py
