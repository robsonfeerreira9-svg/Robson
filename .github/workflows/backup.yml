name: Backup Diário de Dados

on:
  schedule:
    - cron: '0 6 * * *'    # 03:00 horário de Brasília (UTC-3) — manhã
    - cron: '0 18 * * *'   # 15:00 horário de Brasília (UTC-3) — tarde
  workflow_dispatch:         # Permite rodar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Exportar dados, verificar tokens e enviar email
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 scripts/backup.py
