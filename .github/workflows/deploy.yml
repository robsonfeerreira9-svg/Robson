name: Deploy HG Grifes ERP

on:
  push:
    branches: [claude/setup-rls-tables-QA4Za]
  workflow_dispatch:

env:
  SUPABASE_URL: https://eaovtnotwfzuxgtqpkay.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_MhNCcezzMUbC7eEXfKByEA_xrFfZnl_
  SUPABASE_REF: eaovtnotwfzuxgtqpkay

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ── 0. Restaurar backup se banco estiver vazio ────────
      - name: Restaurar backup Supabase (se dados perdidos)
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
import json, subprocess, os, sys, time
from datetime import datetime, timezone

PAT = os.environ['SUPABASE_PAT']
GHTOKEN = os.environ['GITHUB_TOKEN']
REPO = os.environ.get('GITHUB_REPOSITORY', '')
BRANCH = os.environ.get('GITHUB_REF_NAME', '')
REF = 'eaovtnotwfzuxgtqpkay'
API = f'https://api.supabase.com/v1/projects/{REF}'

def supabase_query(sql):
    payload = json.dumps({'query': sql})
    r = subprocess.run([
        'curl', '-s', '-X', 'POST', f'{API}/database/query',
        '-H', f'Authorization: Bearer {PAT}',
        '-H', 'Content-Type: application/json',
        '--data', payload, '--max-time', '30'
    ], capture_output=True, text=True)
    try:
        return json.loads(r.stdout)
    except:
        return {'error': r.stdout}

def write_debug(content, msg='debug: restore result [skip ci]'):
    encoded = subprocess.run(['base64', '-w0'], input=content.encode(), capture_output=True).stdout.decode()
    # get current sha
    sha_r = subprocess.run([
        'curl', '-s', '-H', f'Authorization: token {GHTOKEN}',
        f'https://api.github.com/repos/{REPO}/contents/debug-restore.txt?ref={BRANCH}'
    ], capture_output=True, text=True)
    try:
        sha = json.loads(sha_r.stdout).get('sha', '')
    except:
        sha = ''
    payload = {'message': msg, 'content': encoded, 'branch': BRANCH}
    if sha:
        payload['sha'] = sha
    subprocess.run([
        'curl', '-s', '-X', 'PUT',
        '-H', f'Authorization: token {GHTOKEN}',
        '-H', 'Content-Type: application/json',
        f'https://api.github.com/repos/{REPO}/contents/debug-restore.txt',
        '--data', json.dumps(payload)
    ], capture_output=True)
    print(f'debug-restore.txt gravado: {content[:120]}')

# 1. Verificar quantos dados existem
print('=== Verificando dados atuais ===')
counts = supabase_query(
    "SELECT (SELECT COUNT(*) FROM public.vendas) AS vendas, "
    "(SELECT COUNT(*) FROM public.clientes) AS clientes, "
    "(SELECT COUNT(*) FROM public.movimentacao_caixa) AS mov"
)
print('Counts:', counts)

n_vendas = 0
if isinstance(counts, list) and counts:
    n_vendas = int(counts[0].get('vendas', 0))
elif isinstance(counts, dict):
    row = counts.get('data', [{}])
    if row:
        n_vendas = int(row[0].get('vendas', 0))

print(f'Vendas encontradas: {n_vendas}')

if n_vendas > 0:
    write_debug(f'Banco OK — {n_vendas} vendas encontradas. Nenhum restore necessário.\nCounts: {json.dumps(counts)}')
    print('Banco com dados. Pulando restore.')
    sys.exit(0)

# 2. Banco vazio — buscar backups
print('=== Banco vazio. Buscando backups ===')
r = subprocess.run([
    'curl', '-s', '-w', '\nHTTP_STATUS:%{http_code}',
    f'{API}/database/backups',
    '-H', f'Authorization: Bearer {PAT}'
], capture_output=True, text=True)
lines = r.stdout.strip().split('\n')
http = next((l.split(':')[1] for l in lines if l.startswith('HTTP_STATUS:')), '?')
body = '\n'.join(l for l in lines if not l.startswith('HTTP_STATUS:'))
print(f'Backups HTTP {http}: {body[:300]}')

try:
    data = json.loads(body)
    backups = data if isinstance(data, list) else data.get('backups', data.get('physical_backups', []))
except:
    backups = []

cutoff = datetime(2026, 5, 6, 0, 32, 0, tzinfo=timezone.utc)
valid = []
for b in backups:
    for key in ('inserted_at', 'created_at', 'snapshot_at', 'started_at'):
        ts_str = b.get(key, '')
        if not ts_str:
            continue
        try:
            ts = datetime.fromisoformat(ts_str.replace('Z', '+00:00'))
            if ts < cutoff:
                bid = b.get('id') or b.get('backup_id') or b.get('name', '')
                valid.append((ts, str(bid)))
        except:
            pass
        break

print(f'Backups válidos antes de 06/05: {valid}')

if not valid:
    msg = f'ERRO: Banco vazio mas nenhum backup encontrado antes de 06/05/2026.\nHTTP {http}\nResposta: {body}'
    write_debug(msg)
    print(msg)
    sys.exit(0)

valid.sort(reverse=True)
backup_ts, backup_id = valid[0]
print(f'Restaurando backup {backup_id} de {backup_ts}')

# 3. Iniciar restore
restore_r = subprocess.run([
    'curl', '-s', '-w', '\nHTTP_STATUS:%{http_code}',
    '-X', 'POST',
    f'{API}/database/backups/{backup_id}/restore',
    '-H', f'Authorization: Bearer {PAT}',
    '-H', 'Content-Type: application/json',
    '--data', '{}'
], capture_output=True, text=True)
rlines = restore_r.stdout.strip().split('\n')
rhttp = next((l.split(':')[1] for l in rlines if l.startswith('HTTP_STATUS:')), '?')
rbody = '\n'.join(l for l in rlines if not l.startswith('HTTP_STATUS:'))
print(f'Restore HTTP {rhttp}: {rbody}')

write_debug(
    f'RESTORE INICIADO\nBackup: {backup_id} ({backup_ts})\nHTTP: {rhttp}\nResposta: {rbody}\n\nAguardando 3 minutos...',
    'debug: restore iniciado [skip ci]'
)

if rhttp.startswith('2'):
    print('Restore aceito. Aguardando 180s...')
    time.sleep(180)
    write_debug(f'RESTORE CONCLUÍDO\nBackup: {backup_id}\nHTTP: {rhttp}\n{rbody}', 'debug: restore result [skip ci]')
else:
    print(f'Restore falhou: HTTP {rhttp}')
PYEOF

      # ── 1. Migration via Supabase Management API ──────────
      - name: Migration SQL no Supabase
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "import json; sql=open('sql/schema.sql').read(); print(json.dumps({'query':sql}))" > /tmp/query.json

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            -H "Content-Type: application/json" \
            --data @/tmp/query.json \
            --max-time 60)

          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "HTTP: $HTTP_CODE"
          echo "Response: $BODY"

          # Escrever debug diretamente via GitHub API (não precisa de git push)
          DEBUG_CONTENT=$(printf "HTTP: %s\n%s" "$HTTP_CODE" "$BODY" | base64 -w0)
          FILE_SHA=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt?ref=${GITHUB_REF_NAME}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$FILE_SHA" ]; then
            SHA_PARAM=",\"sha\":\"${FILE_SHA}\""
          else
            SHA_PARAM=""
          fi
          curl -s -X PUT \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt" \
            -d "{\"message\":\"debug: migration result [skip ci]\",\"content\":\"${DEBUG_CONTENT}\",\"branch\":\"${GITHUB_REF_NAME}\"${SHA_PARAM}}"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            echo "Migration concluida!"
          else
            echo "Erro na migration! HTTP $HTTP_CODE"
            exit 1
          fi

      # ── 2. Bucket de Storage ─────────────────────────────
      - name: Criar bucket 'produtos'
        run: |
          curl -sf -X POST \
            "${SUPABASE_URL}/storage/v1/bucket" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"id":"produtos","name":"produtos","public":true}' \
          && echo "Bucket criado" \
          || echo "Bucket ja existe (ok)"

      # ── 3. Deps do projeto ───────────────────────────────
      - name: npm install
        run: npm install

      # ── 4. Deploy Vercel ─────────────────────────────────
      - name: Deploy para Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NRmTqJ7tXyq4AOLENBGyFHsa
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e  # Capturar erros manualmente

          # Obter ou criar projeto via Vercel API
          echo "=== Verificando projeto na Vercel API ==="
          API_RESP=$(curl -s \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/hg-grifes-erp?teamId=${VERCEL_ORG_ID}")
          echo "API resp: ${API_RESP:0:200}"
          PROJECT_ID=$(echo "$API_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)

          if [ -z "$PROJECT_ID" ]; then
            echo "Criando projeto..."
            CREATE_RESP=$(curl -s -X POST \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects?teamId=${VERCEL_ORG_ID}" \
              -d '{"name":"hg-grifes-erp","framework":"nextjs"}')
            echo "Create resp: ${CREATE_RESP:0:200}"
            PROJECT_ID=$(echo "$CREATE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
          fi

          echo "PROJECT_ID: $PROJECT_ID"

          # Criar .vercel/project.json
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          cat .vercel/project.json

          # Adicionar env vars
          echo "=== Vercel Env ==="
          echo "${SUPABASE_URL}" | npx vercel@latest env add \
            NEXT_PUBLIC_SUPABASE_URL production \
            --token "$VERCEL_TOKEN" --force 2>/dev/null || true
          echo "${SUPABASE_ANON_KEY}" | npx vercel@latest env add \
            NEXT_PUBLIC_SUPABASE_ANON_KEY production \
            --token "$VERCEL_TOKEN" --force 2>/dev/null || true

          # Deploy
          echo "=== Vercel Deploy ==="
          export VERCEL_PROJECT_ID="$PROJECT_ID"
          DEPLOY_OUT=$(npx vercel@latest deploy --prod --token "$VERCEL_TOKEN" --yes \
            --build-env NEXT_PUBLIC_SUPABASE_URL="${SUPABASE_URL}" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" 2>&1)
          DEPLOY_EXIT=$?
          echo "$DEPLOY_OUT"

          # Salvar resultado no debug file
          RESULT_TEXT=$(printf "PROJECT_ID=%s\nDEPLOY_EXIT=%s\n%s" "$PROJECT_ID" "$DEPLOY_EXIT" "$DEPLOY_OUT")
          DEBUG_CONTENT=$(echo "$RESULT_TEXT" | base64 -w0)
          FILE_SHA=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt?ref=${GITHUB_REF_NAME}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$FILE_SHA" ]; then SHA_P=",\"sha\":\"${FILE_SHA}\""; else SHA_P=""; fi
          curl -s -X PUT -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt" \
            -d "{\"message\":\"debug: vercel result [skip ci]\",\"content\":\"${DEBUG_CONTENT}\",\"branch\":\"${GITHUB_REF_NAME}\"${SHA_P}}" || true

          DEPLOY_URL=$(echo "$DEPLOY_OUT" | grep "^https://" | tail -1)
          echo ""
          echo "======================================="
          echo "  PROJECT_ID: $PROJECT_ID"
          echo "  DEPLOY_URL: $DEPLOY_URL"
          echo "  EXIT: $DEPLOY_EXIT"
          echo "======================================="

          exit $DEPLOY_EXIT
