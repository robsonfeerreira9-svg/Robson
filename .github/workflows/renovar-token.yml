name: Renovar Token Vercel

on:
  workflow_dispatch:   # Rodar manualmente quando quiser
  schedule:
    - cron: '0 10 1 1 *'  # Todo dia 1 de Janeiro às 07h (Brasília) — lembrete anual

jobs:
  renovar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Gerar novo token Vercel permanente e enviar por email
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/renovar-vercel-token.py
