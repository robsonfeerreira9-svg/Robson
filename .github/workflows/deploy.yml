name: Deploy HG Grifes ERP

on:
  push:
    branches: [claude/setup-rls-tables-QA4Za]
  workflow_dispatch:

env:
  SUPABASE_URL: https://eaovtnotwfzuxgtqpkay.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_MhNCcezzMUbC7eEXfKByEA_xrFfZnl_
  SUPABASE_REF: eaovtnotwfzuxgtqpkay

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ── 1. Migration via Supabase Management API ──────────
      - name: Migration SQL no Supabase
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "import json; sql=open('sql/schema.sql').read(); print(json.dumps({'query':sql}))" > /tmp/query.json

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_PAT}" \
            -H "Content-Type: application/json" \
            --data @/tmp/query.json \
            --max-time 60)

          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "HTTP: $HTTP_CODE"
          echo "Response: $BODY"

          # Escrever debug diretamente via GitHub API (não precisa de git push)
          DEBUG_CONTENT=$(printf "HTTP: %s\n%s" "$HTTP_CODE" "$BODY" | base64 -w0)
          FILE_SHA=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt?ref=${GITHUB_REF_NAME}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$FILE_SHA" ]; then
            SHA_PARAM=",\"sha\":\"${FILE_SHA}\""
          else
            SHA_PARAM=""
          fi
          curl -s -X PUT \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt" \
            -d "{\"message\":\"debug: migration result [skip ci]\",\"content\":\"${DEBUG_CONTENT}\",\"branch\":\"${GITHUB_REF_NAME}\"${SHA_PARAM}}"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] 2>/dev/null; then
            echo "Migration concluida!"
          else
            echo "Erro na migration! HTTP $HTTP_CODE"
            exit 1
          fi

      # ── 2. Bucket de Storage ─────────────────────────────
      - name: Criar bucket 'produtos'
        run: |
          curl -sf -X POST \
            "${SUPABASE_URL}/storage/v1/bucket" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"id":"produtos","name":"produtos","public":true}' \
          && echo "Bucket criado" \
          || echo "Bucket ja existe (ok)"

      # ── 3. Deps do projeto ───────────────────────────────
      - name: npm install
        run: npm install

      # ── 4. Deploy Vercel ─────────────────────────────────
      - name: Deploy para Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NRmTqJ7tXyq4AOLENBGyFHsa
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Vercel Link ==="
          npx vercel@latest link \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --yes 2>&1 || { echo "LINK FALHOU"; exit 1; }

          echo "=== Vercel Env ==="
          echo "${SUPABASE_URL}" | npx vercel@latest env add \
            NEXT_PUBLIC_SUPABASE_URL production \
            --token "$VERCEL_TOKEN" --force 2>/dev/null || true

          echo "${SUPABASE_ANON_KEY}" | npx vercel@latest env add \
            NEXT_PUBLIC_SUPABASE_ANON_KEY production \
            --token "$VERCEL_TOKEN" --force 2>/dev/null || true

          echo "=== Vercel Deploy ==="
          DEPLOY_OUT=$(npx vercel@latest deploy --prod \
            --token "$VERCEL_TOKEN" --yes 2>&1)
          echo "$DEPLOY_OUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUT" | grep "^https://" | tail -1)

          echo ""
          echo "======================================="
          echo "  DEPLOY CONCLUIDO!"
          echo "  URL: $DEPLOY_URL"
          echo "======================================="

          # Salvar URL no debug file
          DEBUG_CONTENT=$(printf "DEPLOY_URL=%s\n%s" "$DEPLOY_URL" "$DEPLOY_OUT" | base64 -w0)
          FILE_SHA=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt?ref=${GITHUB_REF_NAME}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$FILE_SHA" ]; then SHA_PARAM=",\"sha\":\"${FILE_SHA}\""; else SHA_PARAM=""; fi
          curl -s -X PUT \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/debug-migration.txt" \
            -d "{\"message\":\"debug: vercel deploy result [skip ci]\",\"content\":\"${DEBUG_CONTENT}\",\"branch\":\"${GITHUB_REF_NAME}\"${SHA_PARAM}" 2>/dev/null || true
