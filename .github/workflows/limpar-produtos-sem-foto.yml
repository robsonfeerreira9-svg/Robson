name: Limpar Produtos Sem Foto e Zerados

on:
  workflow_dispatch:

env:
  SUPABASE_REF: eaovtnotwfzuxgtqpkay

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apagar produtos sem foto e quantidade zero
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: python3 scripts/limpar-produtos-sem-foto-zerados.py
